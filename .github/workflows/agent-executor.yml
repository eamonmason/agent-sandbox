name: Agent Executor

on:
  issue_comment:
    types: [created]

jobs:
  call-executor:
    if: >-
      !github.event.issue.pull_request
      && github.event.comment.author_association == 'OWNER'
      && contains(github.event.comment.body, '@agent')
      && contains(github.event.comment.body, 'execute')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: eamonmason/ai-workflows/.github/workflows/reusable-executor.yml@d74f701d0f3ef995f9b5eb9e7b00ac4ba7a29ede
    with:
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      issue_title: ${{ github.event.issue.title }}
      verify_command: ./scripts/verify.sh
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
