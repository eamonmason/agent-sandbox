name: Probe - App token opens a PR that triggers checks

# Answers two questions that the agent workflows depend on but cannot isolate:
#   1. Is the GitHub App behind APP_ID/APP_PRIVATE_KEY installed on this repo
#      with contents+PR write?
#   2. Does a PR opened with an App token actually trigger `pull_request`
#      workflows? (One opened with GITHUB_TOKEN does not, which on a repo with
#      strict required checks makes the PR permanently unmergeable.)
# If CI reports on the PR this creates, both are yes.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Push a branch and open a PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="probe/app-token-$(date +%s)"
          git checkout -b "$BRANCH"
          date > probe.txt
          git add probe.txt
          git commit -q -m "probe: app token push"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          gh pr create --title "probe: app token" \
            --body "Probe PR. If CI reports below, the App is installed and App-token PRs trigger pull_request workflows." \
            --base "$BASE_BRANCH" --head "$BRANCH"
